# Body+ · assistente: Cloudflare Worker que guarda a chave do Gemini.
# Publicar: veja "Assistente" no README. A chave NÃO fica aqui:
#   npx wrangler secret put GEMINI_API_KEY
name = "bodyplus-ia"
main = "index.js"
compatibility_date = "2026-11-01"

[vars]
# endereços que podem usar o assistente (separados por vírgula)
ORIGENS = "https://filipejefte.github.io,http://localhost:8000,http://127.0.0.1:8000"
# modelos do Gemini, na ordem: se um estiver sobrecarregado ou sem cota no dia, usa o próximo.
# Os Flash-Lite vêm primeiro: respondem rápido e têm a maior cota gratuita por dia. O Flash (que pensa
# antes de responder) fica por último: nos testes ele passava dos 12 s de prazo dos primeiros da lista.
MODELOS = "gemini-flash-lite-latest,gemini-3.5-flash-lite,gemini-flash-latest"

# limite por pessoa (por IP): 6 perguntas por minuto.
# Se o deploy recusar este bloco no seu plano, apague-o: o Worker funciona sem ele.
[[ratelimits]]
name = "LIMITE"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 6
  period = 60

# Nuvem: planos cifrados (veja "Nuvem" no README). Criar uma vez e colar o id:
#   npx wrangler kv namespace create PLANOS
[[kv_namespaces]]
binding = "PLANOS"
id = "c1a741871d404550824705e9c44410bc"

# gravações na nuvem por pessoa (por IP): a página salva no máximo a cada poucos segundos
[[ratelimits]]
name = "LIMITE_PLANO"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 30
  period = 60
